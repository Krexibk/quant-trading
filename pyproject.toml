[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantlab"
version = "1.0.0"
description = "Backtesting engine, paper-trading ledger and web UI for the quant-trading strategy collection"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["quant", "trading", "backtest", "algorithmic-trading", "paper-trading"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = ["pandas>=2.0", "numpy>=1.24"]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic>=2.6"]
data = ["yfinance>=0.2.40"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27", "ruff>=0.5"]
all = ["quantlab[web,data,dev]"]

[project.scripts]
quantlab = "quantlab.cli:main"

[tool.setuptools.packages.find]
include = ["quantlab*"]

[tool.setuptools.package-data]
quantlab = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = ["E501"]
